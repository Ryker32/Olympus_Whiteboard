[project]
name = "whiteboard-extract"
version = "0.1.0"
description = "Turn photos of a whiteboard into transparent PNG stickers of the handwriting, with marker colors intact."
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "typer>=0.12",
]

[project.optional-dependencies]
people = ["mediapipe>=0.10"]
heic = ["pillow-heif>=0.16"]

[project.scripts]
wbx = "wbx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wbx"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
